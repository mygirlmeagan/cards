<style>
  :root {
    --navy: #12506E;
    --navy-dark: #0B3A52;
    --sky: #4FB3E8;
    --leaf: #7CB342;
    --mist: #F4F8FA;
    --ink: #17323F;
    --muted: #4E6470;
    --line: #D6E2E8;
    --white: #FFFFFF;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--mist); color: var(--ink); font-family: Barlow, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--mist); display: flex; flex-direction: column; }
  @media (min-width: 520px) {
    body { padding: 32px 16px; }
    .card { min-height: 0; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 40px rgba(18,80,110,.15); }
  }
  header { background: var(--navy); color: var(--white); padding: 40px 28px 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .photo { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 4px solid var(--sky); margin-bottom: 6px; }
  h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .role { font-family: "Barlow Condensed", Barlow, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: #9FDAF8; }
  .logo { background: var(--white); padding: 22px 28px; display: flex; justify-content: center; border-bottom: 1px solid var(--line); }
  .logo img { width: 200px; height: auto; }
  .actions { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 16px; letter-spacing: .3px; padding: 15px 18px; border-radius: 8px; min-height: 50px; transition: background .15s, color .15s; }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-save { background: var(--leaf); color: #10240A; }
  .btn-save:hover { background: #6CA033; }
  .btn-secondary { background: var(--white); color: var(--navy); border: 1px solid #9BC3D6; }
  .btn-secondary:hover { background: var(--navy); color: var(--white); }
  .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  section { padding: 0 28px 28px; display: flex; flex-direction: column; gap: 10px; }
  h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--navy); }
  .services { list-style: none; margin: 0; padding: 0; background: var(--white); border: 1px solid var(--line); border-radius: 12px; }
  .services li { padding: 14px 18px; font-size: 17px; font-weight: 500; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .services li:last-child { border-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); flex-shrink: 0; }
  .services li:nth-child(2) .dot { background: var(--sky); }
  footer { margin-top: auto; padding: 24px 28px 36px; background: var(--navy-dark); color: var(--white); text-align: center; display: flex; flex-direction: column; gap: 6px; }
  footer .co { font-size: 18px; font-weight: 700; }
  footer p { margin: 0; font-size: 14px; line-height: 1.5; color: #CFE3EC; }
  footer a { color: #CFE3EC; }
